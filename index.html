<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Foto 50 anos</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="camera-area">

      <video
        id="camera"
        autoplay
        playsinline>
      </video>

      <img
        id="moldura"
        src="moldura.png"
        alt="Moldura da festa">

      <img
        id="fotoResultado"
        alt="Foto final"
        hidden>

    </div>

    <!-- Botão circular durante a câmera -->
    <div id="controleCamera">

      <button
        id="capturar"
        aria-label="Tirar foto">
      </button>

    </div>

    <!-- Botões que aparecem somente depois da foto -->
    <div id="acoes" hidden>

      <button id="salvar">
        ⬇ Salvar imagem
      </button>

      <button id="novaFoto">
        ↻ Tirar outra foto
      </button>

    </div>

  </div>

  <canvas id="canvas"></canvas>

  <script src="script.js"></script>

</body>
</html>
